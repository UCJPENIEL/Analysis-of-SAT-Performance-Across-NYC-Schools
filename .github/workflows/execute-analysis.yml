name: Execute SAT analysis notebook

on:
  push:
    branches: [main]
    paths:
      - "Analysis of SAT Performance Across NYC Schools.ipynb"
      - "schools.csv"
      - "requirements.txt"
      - ".github/workflows/execute-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Execute every notebook cell
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=600 \
            "Analysis of SAT Performance Across NYC Schools.ipynb"

      - name: Generate visual PDF report
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.units import mm
          from reportlab.platypus import (
              SimpleDocTemplate, Paragraph, Spacer, Image, Table, TableStyle,
              PageBreak
          )

          output = Path("NYC_Schools_SAT_Analysis.pdf")
          df = pd.read_csv("schools.csv")
          score_cols = ["average_math", "average_reading", "average_writing"]

          # Independent report-side checks protect against a broken notebook result.
          assert set(["school_name", "borough", "building_code", *score_cols,
                      "percent_tested"]).issubset(df.columns)
          for column in score_cols:
              assert df[column].between(200, 800).all(), f"Invalid legacy SAT range: {column}"
          assert df["percent_tested"].dropna().between(0, 100).all()

          df["total_SAT"] = df[score_cols].sum(axis=1, min_count=3)
          assert df["total_SAT"].dropna().between(600, 2400).all()

          borough = (
              df.dropna(subset=["borough", "total_SAT"])
                .groupby("borough")["total_SAT"]
                .agg(["count", "mean", "median", "std"])
                .reset_index()
                .round(2)
          )
          top10 = (
              df.dropna(subset=["total_SAT"])
                .sort_values(["total_SAT", "school_name"],
                             ascending=[False, True], kind="mergesort")
                [["school_name", "borough", "total_SAT"]]
                .head(10)
                .copy()
          )
          top10["total_SAT"] = top10["total_SAT"].round(0).astype(int)

          participation = df[["percent_tested", "total_SAT"]].dropna()
          participation_pearson = participation["percent_tested"].corr(
              participation["total_SAT"], method="pearson")
          participation_spearman = participation["percent_tested"].corr(
              participation["total_SAT"], method="spearman")
          section_corr = df[score_cols].corr(method="pearson")

          q1 = df["total_SAT"].quantile(0.25)
          q3 = df["total_SAT"].quantile(0.75)
          iqr = q3 - q1
          lower_fence = q1 - 1.5 * iqr
          upper_fence = q3 + 1.5 * iqr
          outlier_count = int(
              ((df["total_SAT"] < lower_fence) |
               (df["total_SAT"] > upper_fence)).sum()
          )
          math_count = int((df["average_math"] >= 640).sum())
          highest_mean = borough.loc[borough["mean"].idxmax()]
          highest_std = borough.loc[borough["std"].idxmax()]
          top_school = top10.iloc[0]

          styles = getSampleStyleSheet()
          styles.add(ParagraphStyle(name="CoverTitle", parent=styles["Title"],
                                    fontSize=22, leading=27, alignment=TA_CENTER,
                                    spaceAfter=12))
          styles.add(ParagraphStyle(name="SubTitle", parent=styles["Normal"],
                                    fontSize=10, leading=15, alignment=TA_CENTER,
                                    textColor=colors.HexColor("#555555")))
          styles.add(ParagraphStyle(name="Section", parent=styles["Heading1"],
                                    fontSize=15, leading=19, spaceBefore=8,
                                    spaceAfter=8, textColor=colors.HexColor("#17365D")))
          styles.add(ParagraphStyle(name="BodySmall", parent=styles["BodyText"],
                                    fontSize=9, leading=13, spaceAfter=6))
          doc = SimpleDocTemplate(str(output), pagesize=A4,
                                  rightMargin=17*mm, leftMargin=17*mm,
                                  topMargin=16*mm, bottomMargin=16*mm)
          story = [
              Spacer(1, 24*mm),
              Paragraph("NYC Public School SAT Performance", styles["CoverTitle"]),
              Paragraph("Exploratory Data Analysis and Borough-Level Comparison",
                        styles["SubTitle"]),
              Spacer(1, 12*mm),
              Paragraph(
                  "This report examines school-level averages for the legacy SAT "
                  "Math, Critical Reading and Writing sections. The three section "
                  "averages are summed to create a school-level comparison metric.",
                  styles["BodyText"]),
              Spacer(1, 5*mm),
              Paragraph("<b>Dataset source:</b> Kaggle — "
                        "<link href='https://www.kaggle.com/datasets/mohamedmostafa259/nyc-public-school-sat-performance-dataset'>"
                        "NYC Public School SAT Performance</link>. The Kaggle upload "
                        "date is not necessarily the test year; the exact testing year "
                        "for this copy is not established in this repository.",
                        styles["BodySmall"]),
              Paragraph("<b>Unit of analysis:</b> one school per row. SAT values are "
                        "school-level averages, not individual student scores.",
                        styles["BodySmall"]),
              Paragraph("<b>Score-format caution:</b> these are legacy three-section "
                        "scores (600–2,400 combined), not current Digital SAT totals "
                        "(400–1,600).",
                        styles["BodySmall"]),
              PageBreak(),
              Paragraph("Dataset overview and key findings", styles["Section"]),
              Paragraph(
                  f"The file contains {len(df):,} school records across "
                  f"{df['borough'].nunique()} boroughs. All {df['total_SAT'].notna().sum():,} "
                  "records have complete Math, Reading and Writing averages. "
                  f"{df['percent_tested'].isna().sum():,} records have no reported "
                  "participation percentage.",
                  styles["BodySmall"]),
              Paragraph(
                  f"<b>Math screening:</b> {math_count} schools meet the project-defined "
                  "640/800 threshold (80% of the section maximum). This is not an "
                  "official College Board proficiency benchmark.",
                  styles["BodySmall"]),
              Paragraph(
                  f"<b>Top combined school-level score:</b> {top_school['school_name']} "
                  f"({int(top_school['total_SAT']):,} out of 2,400).",
                  styles["BodySmall"]),
              Paragraph(
                  f"<b>Highest borough mean:</b> {highest_mean['borough']} "
                  f"({highest_mean['mean']:,.2f}; n={int(highest_mean['count'])}). "
                  f"<b>Largest borough sample standard deviation:</b> "
                  f"{highest_std['borough']} ({highest_std['std']:,.2f}; "
                  f"n={int(highest_std['count'])}). Standard deviation measures "
                  "spread, not achievement.",
                  styles["BodySmall"]),
              Paragraph(
                  f"<b>Potential IQR outliers:</b> {outlier_count}. These are flags for "
                  "investigation, not automatic data errors or grounds for deletion.",
                  styles["BodySmall"]),
              Paragraph(
                  f"<b>Participation association:</b> Pearson r={participation_pearson:.3f} "
                  f"and Spearman rho={participation_spearman:.3f} across "
                  f"{len(participation):,} schools with reported participation. "
                  "This is association, not evidence that participation causes "
                  "higher scores.",
                  styles["BodySmall"]),
              Paragraph("Top 10 schools by combined SAT", styles["Section"])
          ]

          top_data = [["School", "Borough", "Combined SAT"]] + [
              [str(row.school_name), str(row.borough), f"{int(row.total_SAT):,}"]
              for row in top10.itertuples(index=False)
          ]
          top_table = Table(top_data, colWidths=[100*mm, 35*mm, 30*mm], repeatRows=1)
          top_table.setStyle(TableStyle([
              ("BACKGROUND", (0,0), (-1,0), colors.HexColor("#17365D")),
              ("TEXTCOLOR", (0,0), (-1,0), colors.white),
              ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
              ("FONTSIZE", (0,0), (-1,-1), 8),
              ("GRID", (0,0), (-1,-1), 0.35, colors.HexColor("#CCCCCC")),
              ("ROWBACKGROUNDS", (0,1), (-1,-1), [colors.white, colors.HexColor("#F2F5F8")]),
              ("VALIGN", (0,0), (-1,-1), "MIDDLE"),
              ("TOPPADDING", (0,0), (-1,-1), 5),
              ("BOTTOMPADDING", (0,0), (-1,-1), 5),
          ]))
          story += [top_table, Spacer(1, 5*mm),
                    Paragraph("Borough summary (unweighted school-level scores)",
                              styles["Section"])]
          borough_data = [["Borough", "Schools", "Mean", "Median", "Sample SD"]]
          for row in borough.itertuples(index=False):
              borough_data.append([str(row.borough), str(int(row.count)),
                                   f"{row.mean:,.2f}", f"{row.median:,.2f}",
                                   "—" if pd.isna(row.std) else f"{row.std:,.2f}"])
          borough_table = Table(borough_data, colWidths=[43*mm, 25*mm, 30*mm, 30*mm, 30*mm])
          borough_table.setStyle(TableStyle([
              ("BACKGROUND", (0,0), (-1,0), colors.HexColor("#17365D")),
              ("TEXTCOLOR", (0,0), (-1,0), colors.white),
              ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
              ("FONTSIZE", (0,0), (-1,-1), 8),
              ("GRID", (0,0), (-1,-1), 0.35, colors.HexColor("#CCCCCC")),
              ("ROWBACKGROUNDS", (0,1), (-1,-1), [colors.white, colors.HexColor("#F2F5F8")]),
              ("ALIGN", (1,1), (-1,-1), "RIGHT"),
          ]))
          story += [borough_table, PageBreak()]

          charts = [
              ("01_math_benchmark_schools.png", "Schools meeting the Math SAT threshold"),
              ("02_top_10_combined_sat.png", "Ten highest combined legacy SAT school averages"),
              ("03_borough_mean_and_variation.png", "Borough means and within-borough variation"),
              ("04_sat_distribution_by_borough.png", "Combined SAT distribution by borough"),
              ("05_sat_section_correlations.png", "Pearson and Spearman relationships among SAT sections"),
              ("06_participation_vs_sat.png", "Participation versus school-level SAT performance"),
          ]
          for filename, title in charts:
              chart_path = Path("images") / filename
              if not chart_path.is_file():
                  raise FileNotFoundError(f"Expected chart was not generated: {chart_path}")
              story.append(Paragraph(title, styles["Section"]))
              img = Image(str(chart_path))
              img._restrictSize(175*mm, 105*mm)
              story.extend([img, Spacer(1, 5*mm)])
              if filename in ("03_borough_mean_and_variation.png",
                              "05_sat_section_correlations.png"):
                  story.append(PageBreak())

          story += [
              PageBreak(),
              Paragraph("Interpretation and limitations", styles["Section"]),
              Paragraph(
                  "Borough means are unweighted: each school contributes equally because "
                  "the file does not contain enrollment or test-taker counts. They are "
                  "not student-weighted borough averages. Staten Island has a much "
                  "smaller school group, so its summary should be interpreted with care.",
                  styles["BodySmall"]),
              Paragraph(
                  "The standard deviations use the sample formula (ddof=1). A larger "
                  "standard deviation means greater spread among the recorded schools, "
                  "not better performance. IQR outliers are prompts for review, not "
                  "automatic errors.",
                  styles["BodySmall"]),
              Paragraph(
                  "Correlation describes association and does not establish causation. "
                  "School-level averages cannot be used to infer individual student "
                  "outcomes. The participation analysis excludes schools with missing "
                  "percentages, and missingness may not be random.",
                  styles["BodySmall"]),
              Paragraph(
                  "SAT averages alone do not measure overall school quality. The file "
                  "uses the legacy three-section SAT format and its exact testing year "
                  "is not established here. Results should prompt further investigation, "
                  "not serve as a sole basis for school rankings or funding decisions.",
                  styles["BodySmall"]),
              Paragraph(
                  "Reproducibility: the accompanying Jupyter notebook contains the "
                  "full workflow. Charts in this PDF are exported by executing that "
                  "notebook from the repository.",
                  styles["BodySmall"]),
          ]
          doc.build(story)
          print(f"Created {output} ({output.stat().st_size:,} bytes)")
          PY

      - name: Verify execution outputs and exported charts
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          notebook_path = Path("Analysis of SAT Performance Across NYC Schools.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          code_cells = [cell for cell in notebook["cells"] if cell["cell_type"] == "code"]
          executed = [cell for cell in code_cells if cell.get("execution_count") is not None]
          errors = [
              output for cell in code_cells for output in cell.get("outputs", [])
              if output.get("output_type") == "error"
          ]
          assert len(executed) == len(code_cells), (
              f"Only {len(executed)} of {len(code_cells)} code cells executed."
          )
          assert not errors, f"Notebook contains {len(errors)} error output(s)."
          all_source = "\n".join(
              "".join(cell.get("source", [])) for cell in code_cells
          )
          assert "sns.regplot(" in all_source
          assert "fig, ax = plt.subplots(figsize=(9, 6))" in all_source

          expected_charts = [
              "01_math_benchmark_schools.png",
              "02_top_10_combined_sat.png",
              "03_borough_mean_and_variation.png",
              "04_sat_distribution_by_borough.png",
              "05_sat_section_correlations.png",
              "06_participation_vs_sat.png",
          ]
          for name in expected_charts:
              path = Path("images") / name
              assert path.is_file() and path.stat().st_size > 10_000, (
                  f"Missing or unexpectedly small chart: {path}"
              )
              with Image.open(path) as chart:
                  chart.verify()

          corr_hash = hashlib.sha256(
              (Path("images") / "05_sat_section_correlations.png").read_bytes()
          ).digest()
          participation_hash = hashlib.sha256(
              (Path("images") / "06_participation_vs_sat.png").read_bytes()
          ).digest()
          assert corr_hash != participation_hash, (
              "The participation chart is identical to the SAT-correlation chart."
          )

          pdf = Path("NYC_Schools_SAT_Analysis.pdf")
          assert pdf.is_file() and pdf.stat().st_size > 50_000, (
              "The PDF report is missing or unexpectedly small."
          )
          print(f"Executed all {len(executed)} notebook code cells with no errors.")
          print("Verified six valid, non-empty chart exports and a regenerated PDF.")
          PY

      - name: Commit executed notebook, charts, and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Analysis of SAT Performance Across NYC Schools.ipynb" images/ NYC_Schools_SAT_Analysis.pdf
          if git diff --cached --quiet; then
            echo "No executed notebook or chart changes to commit."
          else
            git commit -m "Save executed SAT analysis and visualizations [skip ci]"
            # Another documentation or source update may land while this job runs.
            # Rebase the generated outputs on the latest main before pushing.
            git pull --rebase origin main
            git push
          fi
